<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg Timer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;max-width:420px;margin:0 auto;height:520px;display:flex;flex-direction:column;overflow:hidden;transition:background .4s}
body.done{background:#4caf50}
header{padding:12px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;font-weight:700}
.tabs{display:flex;border-bottom:1px solid #ddd;background:#fff}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;cursor:pointer;border:none;background:none;color:#666}
.tab.active{color:#1a73e8;border-bottom:2px solid #1a73e8;font-weight:600}
.view{flex:1;overflow-y:auto;padding:16px;display:none}
.view.active{display:block}
.timer-display{text-align:center;padding:32px 0}
.time{font-size:64px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.label{font-size:14px;color:#666;margin-top:8px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn-start{background:#1a73e8;color:#fff}
.btn-stop{background:#e53935;color:#fff}
.btn-reset{background:#eee;color:#444;margin-top:8px}
.preset-item{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fff;border-radius:8px;margin-bottom:8px;border:1px solid #e0e0e0}
.preset-info{flex:1}
.preset-name{font-weight:600;font-size:15px}
.preset-time{font-size:13px;color:#666;margin-top:2px}
.preset-actions button{border:none;background:none;cursor:pointer;padding:6px 10px;font-size:13px;border-radius:4px}
.btn-use{color:#1a73e8;font-weight:600}
.btn-del{color:#e53935}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:#555}
.form-group input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px}
.btn-save{background:#1a73e8;color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.empty{text-align:center;color:#999;padding:32px 0;font-size:14px}
details{padding:8px 16px;font-size:11px;color:#888;background:#fafafa;border-top:1px solid #eee}
details summary{cursor:pointer;font-weight:600}
details ul{padding-left:18px;margin-top:4px}
details li{margin-bottom:2px}
</style>
</head>
<body>
<header><h1>🥚 Egg Timer</h1></header>
<div class="tabs">
<button class="tab active" data-tab="timer">Timer</button>
<button class="tab" data-tab="presets">Presets</button>
<button class="tab" data-tab="add">+ New</button>
</div>

<div id="timer" class="view active">
<div class="timer-display">
<div class="time" id="countdown">00:00</div>
<div class="label" id="timerLabel">Select a preset to start</div>
</div>
<button class="btn btn-start" id="startBtn" disabled>Start</button>
<button class="btn btn-reset" id="resetBtn" style="display:none">Reset</button>
</div>

<div id="presets" class="view">
<div id="presetList"></div>
</div>

<div id="add" class="view">
<div class="form-group"><label>Name</label><input id="pName" placeholder="e.g. Soft boiled"></div>
<div class="form-group"><label>Minutes</label><input id="pMin" type="number" min="1" max="99" placeholder="5"></div>
<div class="form-group"><label>Seconds</label><input id="pSec" type="number" min="0" max="59" placeholder="0"></div>
<button class="btn-save" id="saveBtn">Save Preset</button>
</div>

<details>
<summary>Built from your answers</summary>
<ul>
<li>Mobile Android app — Q1, Q4 Requester</li>
<li>Custom presets only — Q2, Q5, Q6 Requester</li>
<li>Local device storage — Q7 Requester</li>
<li>Color change alert — Q3, Q8 Requester</li>
<li>Single timer only — Q9 Requester</li>
</ul>
</details>

<script>
const LS_KEY='egg_timer_presets';
let presets=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
let seconds=0,interval=null,running=false,activePreset='';

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

// Tabs
$$('.tab').forEach(t=>t.addEventListener('click',()=>{
$$('.tab').forEach(x=>x.classList.remove('active'));
$$('.view').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
$('#'+t.dataset.tab).classList.add('active');
}));

function fmt(s){const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}

function renderPresets(){
const list=$('#presetList');
if(!presets.length){list.innerHTML='<div class="empty">No presets yet. Tap + New.</div>';return}
list.innerHTML=presets.map((p,i)=>`<div class="preset-item"><div class="preset-info"><div class="preset-name">${esc(p.name)}</div><div class="preset-time">${fmt(p.seconds)}</div></div><div class="preset-actions"><button class="btn-use" data-i="${i}">Use</button><button class="btn-del" data-i="${i}">Delete</button></div></div>`).join('');
list.querySelectorAll('.btn-use').forEach(b=>b.addEventListener('click',()=>selectPreset(+b.dataset.i)));
list.querySelectorAll('.btn-del').forEach(b=>b.addEventListener('click',()=>deletePreset(+b.dataset.i)));
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function selectPreset(i){
stop();
seconds=presets[i].seconds;
activePreset=presets[i].name;
$('#countdown').textContent=fmt(seconds);
$('#timerLabel').textContent=activePreset;
$('#startBtn').disabled=false;
$('#startBtn').style.display='block';
$('#resetBtn').style.display='none';
document.body.classList.remove('done');
$$('.tab')[0].click();
}

function deletePreset(i){
presets.splice(i,1);
save();renderPresets();
}

function save(){localStorage.setItem(LS_KEY,JSON.stringify(presets))}

$('#saveBtn').addEventListener('click',()=>{
const name=$('#pName').value.trim();
const m=parseInt($('#pMin').value)||0;
const s=parseInt($('#pSec').value)||0;
const total=m*60+s;
if(!name||total<=0)return;
presets.push({name,seconds:total});
save();renderPresets();
$('#pName').value='';$('#pMin').value='';$('#pSec').value='';
$$('.tab')[1].click();
});

$('#startBtn').addEventListener('click',()=>{
if(running)return;
running=true;
document.body.classList.remove('done');
$('#startBtn').style.display='none';
$('#resetBtn').style.display='block';
interval=setInterval(()=>{
seconds--;
$('#countdown').textContent=fmt(seconds);
if(seconds<=0){
stop();
document.body.classList.add('done');
$('#timerLabel').textContent=activePreset+' — Done!';
$('#resetBtn').style.display='block';
}
},1000);
});

function stop(){clearInterval(interval);running=false}

$('#resetBtn').addEventListener('click',()=>{
stop();
document.body.classList.remove('done');
const p=presets.find(x=>x.name===activePreset);
seconds=p?p.seconds:0;
$('#countdown').textContent=fmt(seconds);
$('#timerLabel').textContent=activePreset;
$('#startBtn').style.display='block';
$('#startBtn').disabled=!p;
$('#resetBtn').style.display='none';
});

renderPresets();
</script>
</body>
</html>
